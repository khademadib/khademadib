<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">KDJ reader archive light mode</title>
  <desc id="desc">A light paper-toned subway-window banner with constellation lines and a minimal reader glyph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="0.5" stop-color="#edf2f8"/>
      <stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="43%" r="46%">
      <stop offset="0" stop-color="#5876a5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5876a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe5f2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f7f9fc" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#halo)"/>
  <rect x="44" y="38" width="1112" height="344" rx="22" fill="none" stroke="#7586a0" stroke-width="1.5" opacity="0.5"/>
  <rect x="69" y="62" width="1062" height="296" rx="15" fill="url(#glass)" stroke="#bac7d9" stroke-width="1.5"/>
  <line x1="600" y1="63" x2="600" y2="357" stroke="#b5c1d2" stroke-width="1.4"/>
  <path d="M102 76 L420 76 L280 344 L102 344Z" fill="#ffffff" opacity="0.32"/>
  <path d="M1098 76 L780 76 L920 344 L1098 344Z" fill="#ffffff" opacity="0.24"/>
  <g stroke="#6c82a7" stroke-width="1" fill="none" opacity="0.32">
    <path d="M132 122 L192 150 L256 104 L326 166 L405 116"/>
    <path d="M794 120 L858 165 L926 107 L988 154 L1065 116"/>
    <path d="M156 286 L222 254 L300 294 L368 248" opacity="0.55"/>
    <path d="M832 275 L902 241 L974 288 L1048 250" opacity="0.55"/>
  </g>
  <g fill="#526d99">
    <circle cx="132" cy="122" r="2.3" opacity="0.75"/><circle cx="192" cy="150" r="1.35" opacity="0.55"/><circle cx="256" cy="104" r="1.9" opacity="0.72"/><circle cx="326" cy="166" r="1.25" opacity="0.5"/><circle cx="405" cy="116" r="2.05" opacity="0.76"/>
    <circle cx="794" cy="120" r="1.7" opacity="0.62"/><circle cx="858" cy="165" r="1.25" opacity="0.5"/><circle cx="926" cy="107" r="2.15" opacity="0.78"/><circle cx="988" cy="154" r="1.4" opacity="0.56"/><circle cx="1065" cy="116" r="1.9" opacity="0.7"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">
    <text x="98" y="98" fill="#5f7290" font-size="10">[ MAIN SCENARIO ]</text>
    <text x="98" y="116" fill="#8796ad" font-size="8">STATUS / ACTIVE</text>
    <text x="1102" y="98" text-anchor="end" fill="#5f7290" font-size="10">[ CONSTELLATION LINK ]</text>
    <text x="1102" y="116" text-anchor="end" fill="#8796ad" font-size="8">SIGNAL / STABLE</text>
  </g>
  <g transform="translate(600 151)" stroke="#344b70" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-41 37 Q-20 29 0 45 Q20 29 41 37 V88 Q20 80 0 94 Q-20 80 -41 88 Z" stroke-width="1.8" opacity="0.88"/>
    <path d="M0 45 V94" stroke-width="1.25" opacity="0.62"/>
    <path d="M-29 48 Q-15 44 -7 50" stroke-width="1" opacity="0.3"/>
    <path d="M29 48 Q15 44 7 50" stroke-width="1" opacity="0.3"/>
  </g>
  <text x="600" y="145" text-anchor="middle" fill="#1d2d47" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" letter-spacing="13">KDJ</text>
  <text x="600" y="286" text-anchor="middle" fill="#425a7f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="5">READ  /  OBSERVE  /  BUILD</text>
  <text x="600" y="313" text-anchor="middle" fill="#7f8da3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="4">THE READER'S ARCHIVE</text>
  <g stroke="#9aabc0" opacity="0.5"><line x1="98" y1="333" x2="474" y2="333"/><line x1="726" y1="333" x2="1102" y2="333"/></g>
  <g fill="#788aa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="2"><text x="98" y="350">ARCHIVE / 0001</text><text x="1102" y="350" text-anchor="end">독자 / READER</text></g>
</svg>